<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }
    #orb {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="orb"></div>
  <script src="emma-orb.js"></script>
  <script>
    window.addEventListener('load', () => {
      const container = document.getElementById('orb');
      // Create the orb using the exact web implementation
      new EmmaOrb(container, { hue: 270, hoverIntensity: 0.35, rotateOnHover: true });
    });
  </script>
</body>
</html>
